name: daily-snapshot

on:
  schedule:
    # ── 为什么不是一个 cron ────────────────────────────────────────────────
    # GitHub 官方文档（Troubleshooting workflows）明确说明：
    #   "Scheduled events can be delayed during periods of high loads...
    #    High load times include the start of every hour.
    #    If the load is sufficiently high enough, some queued jobs may be dropped."
    # 整点触发最容易被丢弃，而且丢了不会补。本项目最初用 `0 2,4,6,8`，
    # 实测一整天 0 次触发（14:00 / 16:00 全部静默丢失）。
    #
    # 因此：(1) 全部避开整点，用 :05 触发；
    #       (2) 收盘后额外留两个重试时点；
    #       (3) 真正的可靠性来自本机计划任务 StockDarkPublish 主动 workflow_dispatch。
    #
    # 北京时间：10:05 / 12:05 / 14:05 / 16:05，重试 16:50 / 17:40
    # 注意：15:30 前（10/12/14 三次）A股未收盘，会跳过抓取，只记录状态。
    - cron: '5 2 * * *'
    - cron: '5 4 * * *'
    - cron: '5 6 * * *'
    - cron: '5 8 * * *'
    - cron: '50 8 * * *'
    - cron: '40 9 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '强制重新抓取并发布（忽略"今天已发布"检查）'
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    # 本工作流自己提交的数据更新带 [skip ci]，不重复触发
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # 关键：fetch_all.js 用「本地时间」判断是否已收盘，运行器默认 UTC 会导致误判
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 冗余时点的核心：今天已经发布过就立刻退出，不抓取、不提交、不产生噪音
      - name: Already published today?
        id: pre
        shell: bash
        env:
          FORCE: ${{ inputs.force }}
        run: |
          TODAY=$(date +%F)
          PUB=$(head -n1 docs/version.txt 2>/dev/null || true)
          echo "今天=$TODAY 已发布=${PUB:-无} 强制=$FORCE"
          if [ "$TODAY" = "$PUB" ] && [ "$FORCE" != "true" ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "· $TODAY 的快照已发布，本次空转退出"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.pre.outputs.done != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore fetch cache
        if: steps.pre.outputs.done != 'true'
        uses: actions/cache@v4
        with:
          path: |
            out/cache
            out/history
          key: dark-cache-${{ github.run_id }}
          restore-keys: |
            dark-cache-

      - name: Probe upstream APIs
        if: steps.pre.outputs.done != 'true'
        run: node scripts/ci/probe.js 2>&1 | tee probe.log

      # 收盘前 / 周末不抓取：当日行情未定型，脚本会回退到更早的交易日，
      # 既拿不到当天数据，还可能把更旧的快照发布出去。
      - name: Trading window?
        id: gate
        if: steps.pre.outputs.done != 'true'
        shell: bash
        run: |
          DOW=$(date +%u); H=$(date +%H); M=$(date +%M)
          if [ "$DOW" -ge 6 ]; then
            echo "closed=false" >> "$GITHUB_OUTPUT"
            echo "· 周末（$(date +%F)），跳过抓取"
          elif [ "$H" -gt 15 ] || { [ "$H" -eq 15 ] && [ "$M" -ge 30 ]; }; then
            echo "closed=true" >> "$GITHUB_OUTPUT"
            echo "· 当前 $(date +%H:%M)，已收盘，执行抓取"
          else
            echo "closed=false" >> "$GITHUB_OUTPUT"
            echo "· 当前 $(date +%H:%M)，未到 15:30，跳过抓取（仅更新状态）"
          fi

      - name: Fetch snapshot
        id: fetch
        if: steps.gate.outputs.closed == 'true'
        continue-on-error: true
        shell: bash
        run: |
          # 必须开 pipefail：否则 `node | tee` 的退出码来自 tee，抓取失败会被误判为成功
          set -o pipefail
          for attempt in 1 2 3; do
            echo "===== 抓取尝试 $attempt/3 ====="
            if node scripts/fetch_all.js 2>&1 | tee -a fetch.log; then
              echo "✅ 抓取成功（第 $attempt 次）"
              exit 0
            fi
            echo "⚠ 第 $attempt 次失败；暗盘缓存已保留，重试可续传"
            sleep 20
          done
          echo "✗ 三次尝试均失败"
          exit 1

      - name: Assemble site
        if: steps.fetch.outcome == 'success'
        env:
          FORCE_PUBLISH: ${{ inputs.force }}
        run: node scripts/ci/build_site.js 2>&1 | tee build.log

      # 把当天归档同步成前端翻页用的 docs/data/<date>.json（保留最近 120 个交易日）
      - name: Publish history data
        if: steps.fetch.outcome == 'success'
        env:
          HISTORY_DAYS: '120'
        run: node scripts/ci/publish_history.js 2>&1 | tee history.log

      # 每次运行都留一条"最后检查"记录（即使当天没有新数据），页面角标会显示它。
      # 用来区分「系统正常但没有新数据」（周末/盘中）和「系统挂了」。
      - name: Write last-run marker
        if: always() && steps.pre.outputs.done != 'true'
        shell: bash
        run: |
          mkdir -p docs
          if [ "${{ steps.fetch.outcome }}" = "success" ]; then
            S="已更新"
          elif [ "${{ steps.fetch.outcome }}" = "skipped" ]; then
            S="已跳过（未开盘或周末）"
          elif [ "${{ steps.fetch.outcome }}" = "failure" ]; then
            S="抓取失败"
          else
            S="未抓取"
          fi
          echo "$(date '+%F %H:%M') · $S · 数据 $(head -n1 docs/version.txt 2>/dev/null || echo 无)" > docs/last-run.txt
          cat docs/last-run.txt

      - name: Write run status
        if: always() && steps.pre.outputs.done != 'true'
        env:
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
        run: node scripts/ci/status.js

      - name: Commit site and status
        if: always() && steps.pre.outputs.done != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有变更，跳过提交"
          else
            git commit -m "chore: 运行记录 $(date '+%F %H:%M') [skip ci]"
            # 多个触发源可能同时跑：推送被拒时先 rebase 再重试，避免"数据生成成功但发布失败"
            for i in 1 2 3; do
              if git push; then
                echo "✅ 推送成功"
                break
              fi
              echo "⚠ 推送被拒，rebase 后重试（第 $i 次）"
              git pull --rebase --autostash origin main || true
              sleep 3
            done
          fi

      # 兜底告警：最后一个时点（17:40）仍未发布当天快照 ⇒ 开一个 issue（GitHub 会发邮件）
      # 只在 17:00 之后判断，避免前面几个时点正常重试时误报
      - name: Alert if still stale
        if: always() && steps.pre.outputs.done != 'true' && steps.gate.outputs.closed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TODAY=$(date +%F)
          PUB=$(head -n1 docs/version.txt 2>/dev/null || echo none)
          H=$(date +%H)
          echo "今天=$TODAY 已发布=$PUB 当前小时=$H"
          if [ "$PUB" != "$TODAY" ] && [ "$H" -ge 17 ]; then
            EXIST=$(gh issue list --state open --search "数据未更新 in:title" --json number --jq 'length')
            if [ "$EXIST" = "0" ]; then
              BODY="站点仍停留在 **$PUB**，$TODAY 的快照在全部冗余时点后仍未发布。\n\n请检查：\n1. 仓库 Actions 页面最近一次 daily-snapshot 运行日志\n2. 根目录 status.json 里的 fetchOutcome 与 fetchLogTail\n3. 上游接口是否限流/不可达\n\n修好后手动运行一次：Actions → daily-snapshot → Run workflow。"
              gh issue create --title "⚠ 数据未更新：$TODAY" --body "$(printf '%b' "$BODY")"
            else
              echo "· 已有未关闭的告警 issue，跳过"
            fi
          else
            echo "· 未到 19:00 或已发布，不告警"
          fi

      - name: Fail job if fetch failed
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::fetch_all.js 执行失败，详见上方日志与 status.json"
          exit 1
