name: daily-snapshot

on:
  schedule:
    # 北京时间 10:00 / 12:00 / 14:00 / 16:00（UTC 02:00 / 04:00 / 06:00 / 08:00）
    # A股 15:00 收盘、15:30 后数据才定型：
    #   10:00 / 12:00 / 14:00 三次会回退到上一交易日，因归档已存在而跳过（等同于健康检查 + 状态留痕）；
    #   16:00 那次才会产出当天新数据并真正更新站点。
    - cron: '0 2,4,6,8 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    # 本工作流自己提交的数据更新带 [skip ci]，不重复触发
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # 关键：fetch_all.js 用「本地时间」判断是否已收盘，运行器默认 UTC 会导致误判
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore fetch cache
        uses: actions/cache@v4
        with:
          path: |
            out/cache
            out/history
          key: dark-cache-${{ github.run_id }}
          restore-keys: |
            dark-cache-

      - name: Probe upstream APIs
        run: node scripts/ci/probe.js 2>&1 | tee probe.log

      # 盘中（15:30 前）不抓取：当日行情未定型，脚本会回退到更早的交易日，
      # 既产生不了当天数据，还可能把更旧的快照发布出去。盘中几次只做健康检查 + 状态留痕。
      - name: Market closed?
        id: gate
        shell: bash
        run: |
          H=$(date +%H); M=$(date +%M)
          if [ "$H" -gt 15 ] || { [ "$H" -eq 15 ] && [ "$M" -ge 30 ]; }; then
            echo "closed=true" >> "$GITHUB_OUTPUT"
            echo "· 当前 $(date +%H:%M)，已收盘，执行抓取"
          else
            echo "closed=false" >> "$GITHUB_OUTPUT"
            echo "· 当前 $(date +%H:%M)，未到 15:30，跳过抓取（仅更新状态）"
          fi

      - name: Fetch snapshot
        id: fetch
        if: steps.gate.outputs.closed == 'true'
        continue-on-error: true
        shell: bash
        run: |
          # 必须开 pipefail：否则 `node | tee` 的退出码来自 tee，抓取失败会被误判为成功
          set -o pipefail
          for attempt in 1 2 3; do
            echo "===== 抓取尝试 $attempt/3 ====="
            if node scripts/fetch_all.js 2>&1 | tee -a fetch.log; then
              echo "✅ 抓取成功（第 $attempt 次）"
              exit 0
            fi
            echo "⚠ 第 $attempt 次失败；暗盘缓存已保留，重试可续传"
            sleep 20
          done
          echo "✗ 三次尝试均失败"
          exit 1

      - name: Assemble site
        if: steps.fetch.outcome == 'success'
        run: node scripts/ci/build_site.js 2>&1 | tee build.log

      - name: Write run status
        if: always()
        env:
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
        run: node scripts/ci/status.js

      - name: Commit site and status
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有变更，跳过提交"
          else
            git commit -m "data: snapshot $(date +%F) [skip ci]"
            git push
          fi

      - name: Fail job if fetch failed
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::fetch_all.js 执行失败，详见上方日志与 status.json"
          exit 1
